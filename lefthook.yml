pre-commit:
  parallel: true
  jobs:
    - name: format
      glob: "*.{css,js,json,jsonc,jsx,md,ts,tsx,yaml,yml}"
      exclude:
        - "**/package-lock.json"
      run: npm run format:check:files -- {staged_files}
    - name: lint
      glob: "*.{js,jsx,ts,tsx}"
      # This script owns the Node/Start file sets and their different tsconfigs.
      # Extra paths reach lint:start only and incorrectly type-check E2E fixtures
      # with Start's compiler options. Run the same complete lint check as CI.
      run: npm run lint
    - name: typecheck
      run: npm run typecheck
